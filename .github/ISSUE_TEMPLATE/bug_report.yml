name: Bug report
description: The card is generated incorrectly, or not at all
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before reporting, check if the issue already exists in [open issues](https://github.com/wielorzeczownik/wielorzeczownik/issues).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command
      description: The full `python -m neocard ...` invocation you ran. Redact any token.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: run_method
    attributes:
      label: How are you running the generator?
      options:
        - GitHub Actions (the scheduled workflow)
        - Locally from a checkout
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "e.g. 3.12.7"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste the traceback or the generated SVG fragment that looks wrong.
      render: text

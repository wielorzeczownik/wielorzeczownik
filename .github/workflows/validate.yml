name: Validate

on:
  pull_request:

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      deps: ${{ steps.filter.outputs.deps }}
      markdown: ${{ steps.filter.outputs.markdown }}
      format: ${{ steps.filter.outputs.format }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            python:
              - '.github/workflows/validate.yml'
              - 'neocard/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'requirements_*.txt'
            deps:
              - '.github/workflows/validate.yml'
              - 'pyproject.toml'
              - 'requirements_*.txt'
            markdown:
              - '.github/workflows/validate.yml'
              - '**/*.md'
              - '.markdownlint.json'
            workflows:
              - '.github/workflows/**'
            format:
              - '.github/workflows/validate.yml'
              - '.prettierrc'
              - '**/*.json'
              - '**/*.md'
              - '**/*.yml'
              - '**/*.yaml'

  lint:
    name: Lint (Ruff)
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check

      - name: Format check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: format --check

  test:
    name: Types and tests
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_*.txt

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements_dev.txt

      - name: Type check
        run: mypy neocard tests

      - name: Test
        run: pytest

  pip-audit:
    name: Audit dependencies (pip-audit)
    needs: changes
    if: ${{ needs.changes.outputs.deps == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit
        shell: bash
        run: |
          set -uo pipefail
          if pip-audit --requirement requirements_dev.txt 2>&1 | tee audit.log; then
            exit 0
          fi
          echo "::warning title=pip-audit::Advisories found - see the job summary. Not blocking this pull request."
          {
            echo "### pip-audit findings"
            echo
            echo '```text'
            cat audit.log
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  actionlint:
    name: Lint workflows (actionlint)
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          version: 1.7.12
          shellcheck: true

  prettier:
    name: Formatting (Prettier)
    needs: changes
    if: ${{ needs.changes.outputs.format == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Format check
        run: npx --yes prettier@3.9.6 --check .

  markdownlint:
    name: Markdown lint
    needs: changes
    if: ${{ needs.changes.outputs.markdown == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: "**/*.md"

name: Security Audit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install pip-audit
        run: pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Run audit
        id: audit
        shell: bash
        run: |
          set -uo pipefail
          if pip-audit --requirement requirements_dev.txt 2>&1 | tee audit.log; then
            echo "unresolved=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "unresolved=true" >>"$GITHUB_OUTPUT"
          delimiter="report-$(date +%s%N)"
          {
            echo "report<<${delimiter}"
            cat audit.log
            echo "${delimiter}"
          } >>"$GITHUB_OUTPUT"

      - name: Create issue
        if: ${{ steps.audit.outputs.unresolved == 'true' }}
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_REPORT: ${{ steps.audit.outputs.report }}
        with:
          filename: .github/security-advisory-issue.md
          assignees: ${{ github.repository_owner }}
          search_existing: open
          update_existing: true

      - name: Find advisory issue
        id: advisory_issue
        if: ${{ steps.audit.outputs.unresolved == 'false' }}
        uses: micalevisk/last-issue-action@0d40124cc99ac8601c2516007f0c98ef3d27537b # v2.3.0
        with:
          labels: security-advisory
          state: open

      - name: Close advisory issue
        if: ${{ steps.audit.outputs.unresolved == 'false' && steps.advisory_issue.outputs.has-found == 'true' }}
        uses: peter-evans/close-issue@05dff7ca07116e5707cfb3a3cd4af7bb5e43524c # v3.0.2
        with:
          issue-number: ${{ steps.advisory_issue.outputs.issue-number }}
          comment: '`pip-audit` no longer reports advisories.'

name: Update neofetch card

on:
  schedule:
    - cron: '0 3 * * *'

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - .github/workflows/neofetch.yml
      - neocard/**
      - pyproject.toml
      - uv.lock

permissions: {}

concurrency:
  group: neofetch-card
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: 0.13.5

jobs:
  update:
    name: Regenerate and publish the card
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Regenerate cards from the GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          uv run --locked --no-dev python -m neocard --output-dir dist \
            --user "${{ github.repository_owner }}" \
            --sections identity,system,languages,hobbies,stats \
            --fields uptime,host,kernel,website,socials \
            --stats repos,stars,followers,following,commits,prs,issues \
            --language-sort size \
            --frameworks "React, Vue, Symfony, Phalcon" \
            --real "Polish, English" \
            --hobbies-software "Web apps, Docker automation" \
            --hobbies-hardware "Raspberry Pi, embedded systems" \
            --system "CPU=Meritum 4000 @ 1.77 MHz" \
            --system "GPU=Odra 1305" \
            --system "RAM=48 KB + existential anxiety" \
            --system "WM=Mazovia" \
            --icon "GPU=U+F108" \
            --icon "RAM=U+F035B" \
            --icon "WM=U+F11C"

      - name: Publish cards to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output-neofetch
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
